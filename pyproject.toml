[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatus-tray"
version = "0.1.0"
description = "A small Linux tray monitor for Gatus"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gatus-tray = "gatus_tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
